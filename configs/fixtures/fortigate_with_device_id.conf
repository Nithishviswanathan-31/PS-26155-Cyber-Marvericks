# SYNTHETIC DEMONSTRATION CONFIGURATION — FortiGate/FortiOS with device identification
#config-version=FGT60F v7.4.3,build2573
#serial_number=FGT60FTK20000001
# Model: FortiGate-60F
config system global
    set hostname "branch-firewall-01"
end
config system interface
    edit "port1"
        set allowaccess ping https ssh
    next
end
config log disk setting
    set status enable
end
config system password-policy
    set status enable
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "192.0.2.10"
        next
    end
end
