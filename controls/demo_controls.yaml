controls:
  - control_id: CTRL-001
    name: Secure management transport
    category: MANAGEMENT_ACCESS
    severity: HIGH
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "4.2"
        title: Establish and Maintain a Secure Configuration Process for Network Infrastructure
        description: Establish and maintain a secure configuration process for network infrastructure devices.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: AC-17
        title: Remote Access
        description: Authorizes, monitors, and controls all remote connections to information systems.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: SC-8
        title: Transmission Confidentiality and Integrity
        description: Protects the confidentiality and integrity of transmitted information using encrypted transport.
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-MGT-001-PROTO
        title: Network Infrastructure Management Security (Prototype)
        description: Prototype mapping for network device administrative management session security and cleartext prohibition.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.8.20
        title: Networks Security
        description: Networks and network devices shall be secured, managed and controlled to protect information in systems and applications.
        mapping_status: VERIFIED
    evidence_requirements:
      include_paths: [management.ssh_enabled, management.telnet_enabled]
    remediation_reference:
      cisco_iosxe: REM-CTRL-001-CISCO
      fortigate_fortios: REM-CTRL-001-FORTIGATE
      paloalto_panos: REM-CTRL-001-PALOALTO
    description: Management access should use SSH and should not expose Telnet.
    expected_value: SSH enabled and Telnet disabled
    evaluation:
      type: all
      conditions:
        - path: management.ssh_enabled
          operator: equals
          expected: true
        - path: management.telnet_enabled
          operator: equals
          expected: false
    evidence_rule:
      include_paths:
        - management.ssh_enabled
        - management.telnet_enabled
    remediation:
      cisco_iosxe: Review the vendor configuration and restrict management access to SSH only.
      fortigate_fortios: Review administrative access settings and disable insecure management protocols.
      paloalto_panos: Review device management service settings and restrict access to secure protocols.
      astranet: Apply the approved synthetic secure-channel mapping.

  - control_id: CTRL-002
    name: Audit logging enabled
    category: LOGGING_MONITORING
    severity: MEDIUM
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "8.2"
        title: Collect Audit Logs
        description: Collect audit logs to ensure that events are recorded for security monitoring and incident response.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: AU-12
        title: Audit Record Generation
        description: The system generates audit records for security-relevant events defined by the organization.
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-AUDIT-001-PROTO
        title: Network Audit Log Generation (Prototype)
        description: Prototype mapping requiring network devices to generate audit records for system events and administrative actions.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.8.15
        title: Logging
        description: Logs that record activities, exceptions, faults and other relevant events shall be produced, stored, protected and analysed.
        mapping_status: VERIFIED
    evidence_requirements:
      include_paths: [logging.enabled]
    remediation_reference:
      cisco_iosxe: REM-CTRL-002-CISCO
      fortigate_fortios: REM-CTRL-002-FORTIGATE
      paloalto_panos: REM-CTRL-002-PALOALTO
    description: Configuration logging should be enabled for audit traceability.
    expected_value: Logging enabled
    evaluation:
      type: equals
      conditions:
        - path: logging.enabled
          operator: equals
          expected: true
    evidence_rule:
      include_paths:
        - logging.enabled
    remediation:
      cisco_iosxe: Review logging configuration and enable the required audit logging settings.
      fortigate_fortios: Review event logging configuration and enable the required audit logs.
      paloalto_panos: Review system and configuration log settings and enable the required audit logs.
      astranet: Review the synthetic audit logging setting.

  - control_id: CTRL-003
    name: Secret protection enabled
    category: CREDENTIAL_PROTECTION
    severity: HIGH
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "5.2"
        title: Use Unique Passwords
        description: Use unique passwords for all systems and protect stored credential secrets from disclosure.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: IA-5
        title: Authenticator Management
        description: Manages system authenticators, ensuring passwords and secrets are encrypted or hashed at rest.
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-CRED-001-PROTO
        title: Network Device Credential Protection (Prototype)
        description: Prototype mapping requiring device authentication secrets to be protected using platform encryption mechanisms.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.5.17
        title: Authentication Information
        description: Allocation and management of authentication information shall be controlled, protecting stored passwords and credentials.
        mapping_status: VERIFIED
    evidence_requirements:
      include_paths: [password_protection.enabled]
    remediation_reference:
      cisco_iosxe: REM-CTRL-003-CISCO
      fortigate_fortios: REM-CTRL-003-FORTIGATE
      paloalto_panos: REM-CTRL-003-PALOALTO
    description: Stored credentials or secrets should use the platform protection mechanism.
    expected_value: Secret protection enabled
    evaluation:
      type: equals
      conditions:
        - path: password_protection.enabled
          operator: equals
          expected: true
    evidence_rule:
      include_paths:
        - password_protection.enabled
    remediation:
      cisco_iosxe: Review credential protection settings and enable the platform protection mechanism.
      fortigate_fortios: Review administrator credential protection settings.
      paloalto_panos: Review administrator authentication and credential protection settings.
      astranet: Review the synthetic secret-guard setting.

  - control_id: CTRL-004
    name: Time synchronization configured
    category: TIME_SYNCHRONIZATION
    severity: MEDIUM
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "8.4"
        title: Standardize Time Synchronization
        description: Standardize time synchronization across network devices to ensure accurate and correlated event logging.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: AU-8
        title: Time Stamps
        description: The system uses internal system clocks to generate reliable time stamps for audit records and synchronizes with authoritative sources.
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-TIME-001-PROTO
        title: Network Time Synchronization (Prototype)
        description: Prototype mapping requiring network devices to synchronize internal clocks with redundant authoritative NTP time sources.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.8.17
        title: Clock Synchronization
        description: The clocks of information processing systems within the organization shall be synchronized to approved time sources.
        mapping_status: VERIFIED
    evidence_requirements:
      include_paths: [time_sync.ntp_enabled]
    remediation_reference:
      cisco_iosxe: REM-CTRL-004-CISCO
      fortigate_fortios: REM-CTRL-004-FORTIGATE
      paloalto_panos: REM-CTRL-004-PALOALTO
    description: Network time synchronization should be enabled for consistent event timelines.
    expected_value: NTP enabled
    evaluation:
      type: equals
      conditions:
        - path: time_sync.ntp_enabled
          operator: equals
          expected: true
    evidence_rule:
      include_paths:
        - time_sync.ntp_enabled
    remediation:
      cisco_iosxe: Review NTP configuration and enable approved time synchronization.
      fortigate_fortios: Review system time settings and enable approved NTP synchronization.
      paloalto_panos: Review device time settings and enable approved NTP synchronization.
      astranet: Review the synthetic clock-sync setting.

  - control_id: CTRL-005
    diagnostic_of: CTRL-001
    name: SSH management enabled
    description: Independently verify ssh management enabled using the parsed management property.
    category: MANAGEMENT_ACCESS
    severity: HIGH
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "4.2"
        title: Establish and Maintain a Secure Configuration Process for Network Infrastructure
        description: Ensure network devices maintain secure management configurations by enabling SSH for administrative access.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: AC-17
        title: Remote Access
        description: Enforces remote access control via cryptographic management protocols (SSH).
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-SSH-001-PROTO
        title: Network Device SSH Access (Prototype)
        description: Prototype diagnostic verification of secure encrypted shell configuration.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.8.20
        title: Networks Security
        description: Network devices are configured to only allow secure encrypted management protocols.
        mapping_status: VERIFIED
    expected_value: SSH management enabled
    evaluation:
      type: equals
      conditions:
        - path: management.ssh_enabled
          operator: equals
          expected: true
    evidence_requirements:
      include_paths: [management.ssh_enabled]
    evidence_rule:
      include_paths: [management.ssh_enabled]
    remediation_reference: null

  - control_id: CTRL-006
    diagnostic_of: CTRL-001
    name: Telnet management disabled
    description: Independently verify telnet management disabled using the parsed management property.
    category: MANAGEMENT_ACCESS
    severity: HIGH
    enabled: true
    applicable_vendors: [cisco_iosxe, fortigate_fortios, paloalto_panos]
    framework_mappings:
      - framework_name: CIS
        framework_version: v8
        reference_id: "4.2"
        title: Establish and Maintain a Secure Configuration Process for Network Infrastructure
        description: Ensure network devices disable insecure protocols including plaintext Telnet.
        mapping_status: VERIFIED
      - framework_name: NIST_SP_800_53
        framework_version: Rev. 5
        reference_id: SC-8
        title: Transmission Confidentiality and Integrity
        description: Prohibits cleartext transmission of credentials and management traffic by disabling Telnet.
        mapping_status: VERIFIED
      - framework_name: DISA_STIG
        framework_version: Network Device STIG
        reference_id: STIG-NET-TELNET-001-PROTO
        title: Network Device Telnet Prohibition (Prototype)
        description: Prototype diagnostic verification that unencrypted Telnet service is disabled.
        mapping_status: PROTOTYPE
      - framework_name: ISO_27001
        framework_version: "2022"
        reference_id: A.8.20
        title: Networks Security
        description: Prohibits insecure protocols and plaintext remote management services across network components.
        mapping_status: VERIFIED
    expected_value: Telnet management disabled
    evaluation:
      type: equals
      conditions:
        - path: management.telnet_enabled
          operator: equals
          expected: false
    evidence_requirements:
      include_paths: [management.telnet_enabled]
    evidence_rule:
      include_paths: [management.telnet_enabled]
    remediation_reference: null
